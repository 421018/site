# Public endpoints offered by independent providers, shown in the directory on
# implementar/conectarse. To add one: append an entry; the page updates itself.
#
#   id:       unique, lowercase (provider-service-network)
#   provider: name shown in the directory
#   network:  an id from networks.yaml (mainnet, testnet)
#   service:  an id from services.yaml (evm, comet, grpc, explorer, faucet)
#   url:      the endpoint or site
#
# Within a network and service, the first entry is the default one: the
# "add to wallet" button uses the first evm and explorer entries.

- { id: infinitedrive-evm-mainnet, provider: Infinite Drive, network: mainnet, service: evm, url: "https://evm.infinitedrive.xyz" }
- { id: mschihuahua-evm-mainnet, provider: mschihuahua.org, network: mainnet, service: evm, url: "https://evm-rpc-infinite.mschihuahua.org" }
- { id: infinitepanda-evm-mainnet, provider: infinitepanda.xyz, network: mainnet, service: evm, url: "https://evm-rpc.infinitepanda.xyz" }
- { id: infinitedrive-evm-testnet, provider: Infinite Drive, network: testnet, service: evm, url: "https://evm-rpc-testnet.infinitedrive.xyz" }

