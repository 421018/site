name: Site bug
description: Something on the site doesn't work or looks broken.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must not be reported here. See SECURITY.md.
  - type: input
    id: url
    attributes:
      label: Page
      description: URL or path where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens and what did you expect?
      description: Steps to reproduce, and a screenshot if it's visual.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on Android, Safari on macOS
