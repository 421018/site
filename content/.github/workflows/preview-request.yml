# Asks the private engine repository to build a preview of this pull request.
#
# Runs on pull_request_target so it can use the dispatch token for pull
# requests from forks too. It never checks out or runs the pull request's
# files: it only sends the repository, commit and number. The engine builds
# the preview on its side and comments the links here.
#
# Secret: PREVIEW_DISPATCH_TOKEN, a fine-grained token limited to the engine
# repository with "Contents: read and write" (needed for repository_dispatch).
# Variable: ENGINE_REPOSITORY, e.g. "organization/42chain-web".
name: Request preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch to the engine
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
          ENGINE: ${{ vars.ENGINE_REPOSITORY }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.repository }}
        run: |
          gh api "repos/$ENGINE/dispatches" \
            -f event_type=content-preview \
            -F "client_payload[repo]=$REPO" \
            -F "client_payload[sha]=$SHA" \
            -F "client_payload[pr]=$PR" \
            -F "client_payload[base]=$BASE"
