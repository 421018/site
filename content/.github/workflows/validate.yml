# Validates every pull request against the content contract (contract/):
# front matter, sections, Markdown only (no code), blocks, widgets, diagrams,
# images, internal links and network data. Needs no secrets and no engine.
name: Validate content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run validate
