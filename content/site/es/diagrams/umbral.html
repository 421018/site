  <div class="dg-marks" aria-hidden="true"><span>0</span><span>2/3</span><span>Todo</span></div>
  <div class="dg-row" style="--n: 2">
    <div class="dg-node"><span class="dg-k">Por debajo de dos tercios</span><b>La red se detiene</b><span>No confirma sin la mayoría necesaria.</span></div>
