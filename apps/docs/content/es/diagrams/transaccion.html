<!-- Diagram: lifecycle of a transaction. Used in protocol/execution.md. -->
<ol class="dg-flow" aria-label="Las cinco etapas de una transacción">
  <li><span class="dg-k">01</span><b>Firma</b><span>La billetera la firma con la llave privada.</span></li>
  <li><span class="dg-k">02</span><b>Envío</b><span>Un nodo comprueba la firma y la comparte.</span></li>
  <li><span class="dg-k">03</span><b>Espera</b><span>Queda en la lista de transacciones pendientes.</span></li>
  <li><span class="dg-k">04</span><b>Inclusión</b><span>Un validador la incluye en un bloque, y se confirma.</span></li>
  <li class="on"><span class="dg-k">05</span><b>Resultado</b><span>Éxito o falla. Desde aquí es definitiva.</span></li>
</ol>
