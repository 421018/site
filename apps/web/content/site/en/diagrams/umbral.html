<!-- Where a block is confirmed, and where the network stops. Used in protocol/index.md. -->
<div class="dg-scale" role="group" aria-label="Threshold for confirming a block">
  <div class="dg-track" aria-hidden="true"><i class="stop"></i><i class="ok"></i></div>
  <div class="dg-marks" aria-hidden="true"><span>0</span><span>2/3</span><span>All</span></div>
  <div class="dg-row" style="--n: 2">
    <div class="dg-node"><span class="dg-k">Below two thirds</span><b>The network stops</b><span>It does not confirm without the necessary majority.</span></div>
    <div class="dg-node hub"><span class="dg-k">More than two thirds</span><b>The block is confirmed</b><span>From there it does not come undone.</span></div>
  </div>
  <p class="dg-cap">It tolerates faults of less than one third of the vote. Above that, it stops.</p>
</div>
