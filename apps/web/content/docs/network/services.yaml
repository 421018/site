# Kinds of public service listed in the provider directory, in display order.
# "anchor" is the link target on the connection page (#<anchor>).
# Visitor-facing fields have one value per language: { es: …, en: … };
# "anchor" is part of the URL, so it is one English id for every language.
# "emptyNote" (optional) replaces the generic text when a network has no entries.

- id: evm
  anchor: evm-rpc
  label:
    es: RPC EVM (JSON-RPC)
    en: EVM RPC (JSON-RPC)
  description:
    es: Para billeteras y herramientas compatibles con la EVM, como MetaMask, Hardhat, Foundry, Viem o Ethers.js.
    en: For EVM-compatible wallets and tools, such as MetaMask, Hardhat, Foundry, Viem or Ethers.js.

- id: comet
  anchor: cometbft-rpc
  label:
    es: RPC de CometBFT
    en: CometBFT RPC
  description:
    es: Para billeteras nativas, retransmisores IBC y herramientas del ecosistema Cosmos. Da acceso a los bloques, al consenso y al envío de transacciones nativas.
    en: For native wallets, IBC relayers and Cosmos ecosystem tools. Gives access to blocks, consensus and the submission of native transactions.

- id: grpc
  anchor: grpc
  label:
    es: gRPC
    en: gRPC
  description:
    es: Para consultar desde servicios e indexadores el estado de los módulos propios de la red, como el staking, la gobernanza o los saldos.
    en: For services and indexers that query the state of the network's own modules, such as staking, governance or balances.

- id: explorer
  anchor: explorers
  label:
    es: Exploradores
    en: Explorers
  description:
    es: Para consultar bloques, transacciones, cuentas y contratos desde el navegador.
    en: To look up blocks, transactions, accounts and contracts from the browser.

- id: faucet
  anchor: faucets
  label:
    es: Faucets
    en: Faucets
  description:
    es: Entregan unidades de prueba gratis, para desarrollar y probar.
    en: Give out free test units, for development and testing.
  emptyNote:
    es: La red principal no tiene faucets, porque sus unidades tienen uso real.
    en: The mainnet has no faucets, because its units have real use.
