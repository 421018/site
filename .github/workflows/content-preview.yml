# Builds a preview of a pull request opened in the public content repository
# and comments the links on it. Triggered by that repository's
# "Request preview" workflow (repository_dispatch, type content-preview).
#
# The content is plain Markdown and YAML (no MDX, no scripts: the validator
# and the engine reject them), so building it runs none of the contributor's
# code. Secrets are only exposed to the deploy and comment steps.
#
# Secrets: CLOUDFLARE_API_TOKEN (Pages: edit), CLOUDFLARE_ACCOUNT_ID,
#          CONTENT_REPO_TOKEN (public content repository: "Pull requests: write").
# Variables: CF_SITE_PROJECT, CF_DOCS_PROJECT (Cloudflare Pages project names).
name: Content preview

on:
  repository_dispatch:
    types: [content-preview]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.client_payload.pr }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: ${{ github.event.client_payload.pr }}
      BASE: ${{ github.event.client_payload.base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - name: Replace the catalog with the pull request's content
        run: rm -rf content
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          path: content
          fetch-depth: 0 # "last reviewed" dates come from the content history
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run build
      - run: npm run build:docs
      - name: Deploy previews
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.162.0 pages deploy apps/site/dist --project-name="${{ vars.CF_SITE_PROJECT }}" --branch="pr-$PR"
          npx --yes wrangler@4.162.0 pages deploy apps/docs/dist --project-name="${{ vars.CF_DOCS_PROJECT }}" --branch="pr-$PR"
      - name: Comment the links
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          OUTCOME: ${{ steps.deploy.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            BODY="Vista previa de este cambio:
          - Sitio: https://pr-$PR.${{ vars.CF_SITE_PROJECT }}.pages.dev
          - Documentación: https://pr-$PR.${{ vars.CF_DOCS_PROJECT }}.pages.dev"
          else
            BODY="No se pudo generar la vista previa. Revisa que \`npm run validate\` pase en tu rama; si pasa, alguien del equipo revisará la compilación."
          fi
          gh api "repos/$BASE/issues/$PR/comments" -f body="$BODY"
