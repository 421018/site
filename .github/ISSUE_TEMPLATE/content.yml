name: Content correction or suggestion
description: Report an error in the site's text or suggest new content.
title: "[Content] "
labels: [content]
body:
  - type: markdown
    attributes:
      value: |
        Puedes escribir en español. / You can write in Spanish or English.
        For small fixes, the fastest route is **Editar esta página ↗** on the page itself.
  - type: input
    id: url
    attributes:
      label: Page
      description: URL or path of the page, e.g. /protocolo/consenso
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Factual error
        - Typo or wording
        - Broken link
        - Missing or outdated information
        - New content suggestion
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: Quote the current text if relevant, and explain what it should say and why. Add a source for factual changes.
    validations:
      required: true
